
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Multimedia Elements</title>
</head>
<body>

    <h1>HTML Multimedia Demonstration</h1>

    <!-- Hyperlink -->
    <h2>1. Google Website</h2>
    <p>
        Visit Google:
        <a href="https://www.google.com" target="_blank">
            Open Google
        </a>
    </p>

    <!-- Image -->
    <h2>2. Image</h2>
    <img src="https://picsum.photos/400/250"
         alt="Beautiful nature scenery"
         width="400"
         height="250">

    <!-- Audio -->
    <h2>3. Audio Player</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <!-- Video -->
    <h2>4. Video Player</h2>
    <video width="400" height="250" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <!-- Embedded YouTube Video -->
    <h2>5. Embedded YouTube Video</h2>
    <iframe
        width="400"
        height="250"
        src="https://www.youtube.com/embed/ysz5S6PUM-U"
        title="YouTube video player"
        allowfullscreen>
    </iframe>

</body>
</html>
