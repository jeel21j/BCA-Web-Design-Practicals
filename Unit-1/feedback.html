
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>

    <h1>Feedback Form</h1>
    <p>Please fill out the form below to share your feedback.</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- Full Name -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="fullname"
               placeholder="Enter your full name" required>
        <br><br>

        <!-- Email Address -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
        <br><br>

        <!-- Age -->
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age"
               min="1" max="100" required>
        <br><br>

        <!-- Date of Visit -->
        <label for="date">Date of Visit:</label><br>
        <input type="date" id="date" name="visitdate" required>
        <br><br>

        <!-- Mobile Number -->
        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile"
               placeholder="Enter mobile number">
        <br><br>

        <!-- Website -->
        <label for="website">Website:</label><br>
        <input type="url" id="website" name="website"
               placeholder="https://example.com">
        <br><br>

        <!-- Overall Rating -->
        <label for="rating">Overall Rating (1 to 10):</label><br>
        <input type="range" id="rating" name="rating"
               min="1" max="10" value="5">
        <br><br>

        <!-- Favourite Theme Color -->
        <label for="color">Favourite Theme Color:</label><br>
        <input type="color" id="color" name="themeColor">
        <br><br>

        <!-- Upload Screenshot -->
        <label for="screenshot">Upload Screenshot:</label><br>
        <input type="file" id="screenshot" name="screenshot"
               accept="image/*">
        <br><br>

        <!-- Submit and Reset Buttons -->
        <input type="submit" value="Submit Feedback">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
