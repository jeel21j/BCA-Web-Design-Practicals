
<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #1b5e20;
        }

        .container {
            background-color: white;
            padding: 25px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 10px;
        }

        button {
            background-color: green;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: blue;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #424242;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Multiplication Table</h1>

        <!-- Input Field -->
        <input type="number" id="number"
            placeholder="Enter a number">

        <br><br>

        <!-- Generate Button -->
        <button onclick="generateTable()">
            Generate Table
        </button>

        <!-- Display Table -->
        <div id="result"></div>

    </div>

    <script>

        // JavaScript Function
        function generateTable() {

            // Get Input Number
            let num = document.getElementById("number").value;

            // Check Input
            if (num.trim() === "" || !Number.isFinite(Number(num))) {
                document.getElementById("result").innerHTML =
                    "Please enter a valid number.";
                return;
            }

            num = Number(num);

            // Variable to Store Table
            let output = "<h3>Multiplication Table of " + num + "</h3>";

            // For Loop
            for (let i = 1; i <= 10; i++) {

                output += num + " × " + i + " = " + (num * i) + "<br>";

            }

            // Display Table
            document.getElementById("result").innerHTML = output;

        }

    </script>

</body>
</html>
